" y="83.589" fill="#000" font-size="14" textLength="58.693">(nested)</text></g><g class="participant participant-head" data-qualified-name="Core2" data-entity-uid="part5" id="part5-head" data-source-line="56"><rect x="890.39" y="63.594" width="149.707" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="897.39" y="83.589" fill="#000" font-size="14" textLength="135.707">FB_&lt;Device>_Core</text></g><g class="participant participant-tail" data-qualified-name="RT2" data-entity-uid="part1" id="part1-tail" data-source-line="52"><rect x="10" y="828.008" width="134.251" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="848.003" fill="#000" font-size="14" textLength="120.251">TwinCAT runtime</text></g><g class="participant participant-tail" data-qualified-name="PRG2" data-entity-uid="part2" id="part2-tail" data-source-line="53"><rect x="184.417" y="828.008" width="121.358" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="191.417" y="848.003" fill="#000" font-size="14" textLength="107.358">PRG_&lt;Device></text></g><g class="participant participant-tail" data-qualified-name="Host" data-entity-uid="part3" id="part3-tail" data-source-line="54"><rect x="446.973" y="828.008" width="163.625" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="488.789" y="848.003" fill="#000" font-size="14" textLength="79.994">FB_&lt;Host></text><text x="453.973" y="864.3" fill="#000" font-size="14" textLength="149.625">(encloses the device)</text></g><g class="participant participant-tail" data-qualified-name="Nested" data-entity-uid="part4" id="part4-tail" data-source-line="55"><rect x="743.41" y="828.008" width="109.997" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="750.41" y="848.003" fill="#000" font-size="14" textLength="95.997">FB_&lt;Device></text><text x="769.062" y="864.3" fill="#000" font-size="14" textLength="58.693">(nested)</text></g><g class="participant participant-tail" data-qualified-name="Core2" data-entity-uid="part5" id="part5-tail" data-source-line="56"><rect x="890.39" y="828.008" width="149.707" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="897.39" y="848.003" fill="#000" font-size="14" textLength="135.707">FB_&lt;Device>_Core</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg1" data-source-line="58"><polygon points="233.097,120.023,243.097,124.023,233.097,128.023,237.097,124.023" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="77.125" y1="124.023" x2="239.097" y2="124.023" style="stroke:#181818;stroke-width:1;"/><text x="84.125" y="118.958" fill="#000" font-size="13" textLength="143.971">allocate instance data</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg2" data-source-line="59"><polygon points="516.786,164.289,526.786,168.289,516.786,172.289,520.786,168.289" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="245.097" y1="168.289" x2="522.786" y2="168.289" style="stroke:#181818;stroke-width:1;"/><text x="252.097" y="148.09" fill="#000" font-size="13" textLength="259.689">FB_Init(aiMotionStage, astPositionState,</text><text x="252.097" y="163.223" fill="#000" font-size="13" textLength="152.014">fbFFHWO, fbArbiter, ...)</text></g><g class="message" data-entity-1="part3" data-entity-2="part3" id="msg3" data-source-line="60"><line x1="528.786" y1="197.422" x2="570.786" y2="197.422" style="stroke:#181818;stroke-width:1;"/><line x1="570.786" y1="197.422" x2="570.786" y2="210.422" style="stroke:#181818;stroke-width:1;"/><line x1="529.786" y1="210.422" x2="570.786" y2="210.422" style="stroke:#181818;stroke-width:1;"/><polygon points="539.786,206.422,529.786,210.422,539.786,214.422,535.786,210.422" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="535.786" y="192.356" fill="#000" font-size="13" textLength="226.332">store its own REFERENCE TO fields</text></g><path d="M803.408,223.422 L803.408,293.422 L1131.408,293.422 L1131.408,233.422 L1121.408,223.422 L803.408,223.422" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1121.408,223.422 L1121.408,233.422 L1131.408,233.422 L1121.408,223.422" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="809.408" y="240.489" fill="#000" font-size="13" textLength="273.197">The nested device is built while the host's</text><text x="809.408" y="255.622" fill="#000" font-size="13" textLength="286.628">declarations run, before the host has stored</text><text x="809.408" y="270.754" fill="#000" font-size="13" textLength="266.875">its references. The nested FB_Init saw nil</text><text x="809.408" y="285.887" fill="#000" font-size="13" textLength="307.811">references, so the device cannot use them yet.</text><g class="message" data-entity-1="part3" data-entity-2="part4" id="msg4" data-source-line="67"><polygon points="786.408,316.086,796.408,320.086,786.408,324.086,790.408,320.086" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="528.786" y1="320.086" x2="792.408" y2="320.086" style="stroke:#181818;stroke-width:1;"/><text x="535.786" y="315.02" fill="#000" font-size="13" textLength="142.835">FB_Init(nil references)</text></g><g class="message" data-entity-1="part4" data-entity-2="part5" id="msg5" data-source-line="68"><polygon points="953.243,345.219,963.243,349.219,953.243,353.219,957.243,349.219" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="798.408" y1="349.219" x2="959.243" y2="349.219" style="stroke:#181818;stroke-width:1;"/><text x="805.408" y="344.153" fill="#000" font-size="13" textLength="142.835">FB_Init(nil references)</text></g><g class="message" data-entity-1="part5" data-entity-2="part5" id="msg6" data-source-line="69"><line x1="965.243" y1="393.484" x2="1007.243" y2="393.484" style="stroke:#181818;stroke-width:1;"/><line x1="1007.243" y1="393.484" x2="1007.243" y2="406.484" style="stroke:#181818;stroke-width:1;"/><line x1="966.243" y1="406.484" x2="1007.243" y2="406.484" style="stroke:#181818;stroke-width:1;"/><polygon points="976.243,402.484,966.243,406.484,976.243,410.484,972.243,406.484" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="972.243" y="373.286" fill="#000" font-size="13" textLength="174.821">ReferencesValid() = FALSE</text><text x="972.243" y="388.418" fill="#000" font-size="13" textLength="145.533">the body returns early</text></g><g class="message" data-entity-1="part1" data-entity-2="part3" id="msg7" data-source-line="70"><polygon points="516.786,446.75,526.786,450.75,516.786,454.75,520.786,450.75" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="77.125" y1="450.75" x2="522.786" y2="450.75" style="stroke:#181818;stroke-width:1;"/><text x="84.125" y="430.551" fill="#000" font-size="13" textLength="141.458">call_after_init pragma</text><text x="84.125" y="445.684" fill="#000" font-size="13" textLength="143.127">fires Host.CallAfterInit</text></g><g class="message" data-entity-1="part3" data-entity-2="part4" id="msg8" data-source-line="71"><polygon points="786.408,506.148,796.408,510.148,786.408,514.148,790.408,510.148" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="528.786" y1="510.148" x2="792.408" y2="510.148" style="stroke:#181818;stroke-width:1;"/><text x="535.786" y="474.817" fill="#000" font-size="13" textLength="245.623">CallAfterInit&lt;Device>(aiMotionStage,</text><text x="535.786" y="489.95" fill="#000" font-size="13" textLength="178.369">astPositionState, fbFFHWO,</text><text x="535.786" y="505.083" fill="#000" font-size="13" textLength="83.104">fbArbiter, ...)</text></g><g class="message" data-entity-1="part4" data-entity-2="part5" id="msg9" data-source-line="72"><polygon points="953.243,535.281,963.243,539.281,953.243,543.281,957.243,539.281" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="798.408" y1="539.281" x2="959.243" y2="539.281" style="stroke:#181818;stroke-width:1;"/><text x="805.408" y="534.215" fill="#000" font-size="13" textLength="129.873">CallAfterInitCore(...)</text></g><g class="message" data-entity-1="part5" data-entity-2="part5" id="msg10" data-source-line="73"><line x1="965.243" y1="583.547" x2="1007.243" y2="583.547" style="stroke:#181818;stroke-width:1;"/><line x1="1007.243" y1="583.547" x2="1007.243" y2="596.547" style="stroke:#181818;stroke-width:1;"/><line x1="966.243" y1="596.547" x2="1007.243" y2="596.547" style="stroke:#181818;stroke-width:1;"/><polygon points="976.243,592.547,966.243,596.547,976.243,600.547,972.243,596.547" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="972.243" y="563.348" fill="#000" font-size="13" textLength="184.292">rebind REFERENCE TO fields</text><text x="972.243" y="578.481" fill="#000" font-size="13" textLength="99.074">rewire fbStates</text></g><g class="message" data-entity-1="part3" data-entity-2="part3" id="msg11" data-source-line="74"><line x1="528.786" y1="640.813" x2="570.786" y2="640.813" style="stroke:#181818;stroke-width:1;"/><line x1="570.786" y1="640.813" x2="570.786" y2="653.813" style="stroke:#181818;stroke-width:1;"/><line x1="529.786" y1="653.813" x2="570.786" y2="653.813" style="stroke:#181818;stroke-width:1;"/><polygon points="539.786,649.813,529.786,653.813,539.786,657.813,535.786,653.813" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="535.786" y="620.614" fill="#000" font-size="13" textLength="180.362">(all nested devices re-wired</text><text x="535.786" y="635.747" fill="#000" font-size="13" textLength="136.456">before the first scan)</text></g><path d="M182.33,666.813 L182.33,812.813 L1027.33,812.813 L1027.33,676.813 L1017.33,666.813 L182.33,666.813" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1017.33,666.813 L1017.33,676.813 L1027.33,676.813 L1017.33,666.813" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="447.612" y="683.879" fill="#000" font-size="13" textLength="268.957">Rule: a device in a PRG needs no re-wire.</text><text x="447.612" y="699.012" fill="#000" font-size="13" textLength="291.91">A device inside another FB is re-wired by the</text><text x="447.612" y="714.145" fill="#000" font-size="13" textLength="246.924">host from the host's own CallAfterInit.</text><text x="447.612" y="729.278" fill="#000" font-size="13" textLength="290.85">Never call CallAfterInit on the same instance</text><text x="447.612" y="744.411" fill="#000" font-size="13" textLength="70.472">from itself.</text><text x="447.612" y="759.543" fill="#000" font-size="13" textLength="227.887">Declaration initialisers that index a</text><text x="447.612" y="774.676" fill="#000" font-size="13" textLength="306.116">reference (an array of FB_CC_StatePMPSConfig</text><text x="447.612" y="789.809" fill="#000" font-size="13" textLength="297.75">bound to astPositionState) belong in the PRG,</text><text x="447.612" y="804.942" fill="#000" font-size="13" textLength="204.071">where the references are valid.</text><?plantuml-src VLHDRzim3BtxLn2xB05S7teSkW9fcgm3rW-amNO94CWnxGXJf4oKw-NVZvJjn6cs-MH8Z-JZuwFefxPxvTKE27_LQ3VuY4IgmedHbGM3PKZeYF58UsUfnzoXSSt4UzT0y3KcGGU3S9t1Qr0-NDLxQBJNjagXm3UzGR180GlG5fHrOOiUvdT9mhc3tkYziW4-B1jjfvCb-De6lSCFe0WMo-jpqClYo_hcFkQyZGW-U0UPtwrl7Xo5svKTSLl64H9moOxAE8O9u3AiIyo1BTyM-nJ__ubUJvrlsShFTP8mQRYwZSpW4oXZt4O5vDufA9OP2XLK4cyP9KGOnVc-MXr6IZ-we9rb7IjCEMbuSQIxau3fofRvVFxm